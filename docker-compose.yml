version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: bhoomitrust_db
    volumes:
      - bhoomi_mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: bhoomitrust_db
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      PASSWORD_HASH_SCHEME: ${PASSWORD_HASH_SCHEME:-bcrypt}
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-regex}
      TRANSLATE_ENABLED: ${TRANSLATE_ENABLED:-true}
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - bhoomi_uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3004:3000"

volumes:
  bhoomi_mongodata:
  bhoomi_uploads:
